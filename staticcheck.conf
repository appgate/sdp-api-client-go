# The checks disabled below fire only on code generated by openapi-generator
# (everything under ./api), not on hand-written code. Each is kept because a
# durable fix lives in the generator templates, not in this repo.
checks = [
  "all",
  # Capitalized error strings, e.g. `errors.New("Cannot specify ...")`, emitted
  # by the openapi-generator client/configuration/oneOf templates. Cosmetic;
  # a durable fix needs template-patches + full regeneration.
  "-ST1005",
  # client.go's contains() helper compares strings.ToLower(a) == strings.ToLower(b)
  # instead of using strings.EqualFold. From the openapi-generator client
  # template; fixable via a template-patch + regeneration.
  "-SA6005",
  # Generated code imports the deprecated io/ioutil (deprecated since Go 1.19).
  # The pinned openapi-generator v6.0.0 predates the io/os migration; resolving
  # this needs a template-patch (or a generator upgrade) + regeneration.
  "-SA1019",
]
